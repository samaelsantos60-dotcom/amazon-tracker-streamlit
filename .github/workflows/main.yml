name: Executar Amazon Tracker

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar Recolha de Dados
        run: python main.py

      - name: Guardar Base de Dados no Repositório
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f amazon_tracker.db
          git commit -m "Atualização automática da base de dados [skip ci]" || exit 0
          git push
from alerts import send_alert

send_alert("🤖 <b>Teste:</b> O bot do Telegram está a funcionar perfeitamente!")
